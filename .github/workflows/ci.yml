name: CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "eval/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "eval/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Also runs `tsc -b`, so this is the same check Vercel's build will make.
      - name: Typecheck and build
        run: npm run build

  tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q -rs

  eval:
    name: Golden-query eval (live LLM)
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start API server
        run: |
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Run golden dataset eval
        run: python eval/run_eval.py --api-url http://localhost:8000

      - name: Print server logs on failure
        if: failure()
        run: cat backend/server.log || true

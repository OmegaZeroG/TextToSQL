<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23166a4a'/%3E%3Cpath d='M9 12c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3zm0 0v8c0 1.7 3.1 3 7 3s7-1.3 7-3v-8' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" />
    <meta name="description" content="Ask in plain English, get SQL. Add your schema for queries checked against your real tables." />
    <title>plainquery — Text to SQL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Light by default. Dark only if the visitor chose it, applied before first paint so there is no flash.
      try {
        if (localStorage.getItem("text-to-sql:theme") === "dark") {
          document.documentElement.classList.add("dark");
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute("content", "#14201b");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
